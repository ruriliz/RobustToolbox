
name: Check Mobile 277 Stage 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify engine
        run: |
          test "$(git -C RobustToolbox rev-parse HEAD)" = \
            "08a3d120b7029d03e60b44b23fed2b2659ed3224"

      - name: Check partial patch
        run: |
          git -C RobustToolbox apply \
            --check ../mobile-277-stage1.patch

      - name: Apply partial patch
        run: |
          git -C RobustToolbox apply \
            ../mobile-277-stage1.patch
